name: Build ER-301 firmware (stolmine + sun)

# Builds the stolmine community firmware at a fixed release, with the "sun"
# screensaver added. Runs on every push, or manually from the Actions tab.
on:
  workflow_dispatch:
  push:

env:
  BASE_REPO: https://github.com/stolmine/er-301-stolmine.git
  BASE_TAG: v0.7.0-stolmine.9.7.0
  OUR_TAG: v0.7.0-stolmine.9.7.0-sun3

permissions:
  contents: write   # lets the workflow publish the firmware as a GitHub release

jobs:
  firmware:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y python3 zip gcc-multilib libc6:i386 libstdc++6:i386 lib32z1 libpcre2-dev bison automake autoconf

    - name: Cache TI Processor SDK
      id: cache-ti
      uses: actions/cache@v4
      with:
        path: ~/ti
        key: ti-processor-sdk-rtos-am335x-04.01.00.06

    - name: Download TI Processor SDK RTOS AM335x 04.01.00.06
      if: steps.cache-ti.outputs.cache-hit != 'true'
      timeout-minutes: 15
      run: |
        URL=https://software-dl.ti.com/processor-sdk-rtos/esd/AM335X/04_01_00_06/exports/ti-processor-sdk-rtos-am335x-evm-04.01.00.06-Linux-x86-Install.bin
        wget --progress=dot:giga -O ti-install.bin "$URL"
        chmod +x ti-install.bin

    - name: Install TI Processor SDK (unattended)
      if: steps.cache-ti.outputs.cache-hit != 'true'
      timeout-minutes: 25
      run: |
        # The installer hangs at the very end (post-install step) once all
        # components are in place, so it is cut off by a timeout.
        timeout 20m ./ti-install.bin --mode unattended --prefix "$HOME/ti" < /dev/null || echo "installer exit code $?"
        ls "$HOME/ti"
        test -d "$HOME/ti/gcc-arm-none-eabi-4_9-2015q3"

    - name: Cache SWIG 4.2.1
      id: cache-swig
      uses: actions/cache@v4
      with:
        path: ~/.local/swig-4.2.1
        key: swig-4.2.1-ubuntu-22.04

    - name: Build SWIG 4.2.1 (stolmine expects it at ~/.local/swig-4.2.1)
      if: steps.cache-swig.outputs.cache-hit != 'true'
      run: |
        wget -q -O swig.tar.gz https://github.com/swig/swig/archive/refs/tags/v4.2.1.tar.gz
        tar xzf swig.tar.gz
        cd swig-4.2.1
        ./autogen.sh
        ./configure --prefix="$HOME/.local/swig-4.2.1"
        make -j"$(nproc)"
        make install
        "$HOME/.local/swig-4.2.1/bin/swig" -version

    - name: Get stolmine source at ${{ env.BASE_TAG }}
      run: |
        git clone --depth 1 --branch "$BASE_TAG" "$BASE_REPO" src
        cd src && git log -1 --format='%h %s'

    - name: Add the sun and suns screensavers
      run: |
        python3 ci/apply_sun.py src od/graphics/screensavers
        cd src
        git add -A
        git -c user.name=ci -c user.email=ci@localhost commit -qm "Add sun and suns screensavers"
        git tag "$OUR_TAG"
        git describe --match 'v*.*.*-*' --tags --abbrev=0

    - name: Build firmware
      working-directory: src
      run: make firmware ARCH=am335x

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: er-301-firmware-stolmine-9.7.0-sun
        path: src/release/am335x/er-301-v*.zip

    - name: Publish firmware as a release (direct download, no extra zip layer)
      if: github.ref == 'refs/heads/sun-screensaver'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        FILE=$(ls src/release/am335x/er-301-v*.zip)
        REL="firmware-${OUR_TAG#v}"
        if gh release view "$REL" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release upload "$REL" "$FILE" --clobber -R "$GITHUB_REPOSITORY"
        else
          gh release create "$REL" "$FILE" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "ER-301 stolmine 9.7.0 + sun / suns screensavers" \
            --notes "stolmine 9.7.0 (2fbb7ce) with two extra screensavers (sun, suns) and a 10 second screensaver timeout option. Download the .zip below and put it, unopened, into the front card's firmware folder."
        fi
